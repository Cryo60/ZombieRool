plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.14,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// The public repository keeps the canonical source tree at its root.
sourceSets {
    main {
        java.setSrcDirs(['java'])
        resources.setSrcDirs(['resources', 'src/generated/resources'])
    }
}

// Exporting every transformed class is expensive on the development drive.
// Enable it explicitly for a Mixin investigation: -PzrMixinDiagnostics=true.
def zrMixinDiagnostics = providers.gradleProperty('zrMixinDiagnostics').map { it.toBoolean() }.getOrElse(false)

// A running dev client streams audio from its resource directory. Build cleanup
// must never remove those files when a new JAR is compiled during a play test.
if (gradle.startParameter.taskNames.any { it.tokenize(':').last().startsWith('runClient') || it.tokenize(':').last() == 'runServer' }) {
    def sessionId = System.currentTimeMillis()
    // Windows exFAT volumes can allocate 1 MiB for every tiny resource file.
    // Keep independent snapshots on the local cache drive instead of multiplying
    // that allocation cost in a workspace stored on an external/exFAT drive.
    def localCache = System.getenv('LOCALAPPDATA')
    def sessionRoot = localCache ? new File(localCache, "ZombieRool/dev-resources/${Integer.toHexString(rootDir.absolutePath.hashCode())}") : file('build/resources/dev-sessions')
    def sessionResources = new File(sessionRoot, sessionId.toString())
    def sessionCopy = tasks.register("prepareDevSessionResources${sessionId}", ProcessResources) {
        from sourceSets.main.resources
        into sessionResources
        def replacements = [mod_id:mod_id, mod_version:mod_version, mod_license:mod_license, minecraft_version:minecraft_version, forge_version:forge_version]
        inputs.properties replacements
        filesMatching('META-INF/mods.toml') { expand replacements }
    }
    sourceSets.main.output.resourcesDir = sessionResources
    tasks.named('processResources').configure { enabled = false }
    tasks.named('classes').configure { dependsOn sessionCopy }
}


minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true
    enableIdeaPrepareRuns = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.main"

            jvmArgs '-Dmixin.env.ignoreRequired=true'
            jvmArgs '-Dmixin.env.disableRefMap=true'

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', zrMixinDiagnostics ? 'debug' : 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
        }

        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }

        def clientRun = client

        client1 {
            parent clientRun
            workingDirectory project.file('run-mp1')
            args '--username', 'Player1', '--quickPlayMultiplayer', 'localhost'
        }

        client2 {
            parent clientRun
            workingDirectory project.file('run-mp2')
            args '--username', 'Player2', '--quickPlayMultiplayer', 'localhost'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    flatDir {
        dirs 'libs', 'dev-libs'
    }
}

configurations {
    shade
    compileOnly.extendsFrom shade
}

def taczVersion = providers.gradleProperty('tacz_version').getOrElse('1.1.8-hotfix2')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Packed into the mod jar under another package. TacZ ships its own luaj; a second
    // org.luaj on the module path crashes with a split package.
    shade('org.luaj:luaj-jse:3.0.1')

    // Compile against the raw jar (own class names stay readable). Runtime must be remapped
    // SRG -> official or TacZ mixins/code explode in the MDK.
    compileOnly files("dev-libs/tacz-1.20.1-${taczVersion}.jar")
    runtimeOnly fg.deobf("blank:tacz:1.20.1-${taczVersion}")

    // Same dev world mods as Grimoire. Effortless Building 3.11 JiJ Flywheel/Ponder are extracted into libs/.
    runtimeOnly fg.deobf('curse.maven:embeddium-908741:5681725')
    // Dev run uses official names. A production jar in run/mods still calls SRG fields (f_84822_) and crashes.
    runtimeOnly fg.deobf("maven.modrinth:oculus:1.20.1-1.8.0")
    runtimeOnly fg.deobf('blank:effortlessbuilding:1.20.1-3.11')
    runtimeOnly fg.deobf('blank:flywheel-forge-1.20.1:1.0.6-beta-266')
    runtimeOnly fg.deobf('blank:Ponder-Forge-1.20.1:1.0.91')
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"

    config "mixins.${mod_id}.json"

    debug.verbose = zrMixinDiagnostics
    debug.export = zrMixinDiagnostics
    dumpTargetOnFailure = true

    quiet
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id           : mod_id,
            mod_version      : mod_version,
            mod_license      : mod_license,
            minecraft_version: minecraft_version,
            forge_version    : forge_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveClassifier.set('slim')
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_id,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "mixins.${mod_id}.json"
        ])
    }
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar).configure {
    configurations = [project.configurations.shade]
    archiveClassifier.set('')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    relocate 'org.luaj', 'me.cryo.zombierool.shadow.luaj'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_id,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "mixins.${mod_id}.json"
        ])
    }
}

reobf {
    shadowJar {}
}

tasks.named('build').configure {
    dependsOn tasks.named('reobfShadowJar')
}

apply from: 'gradle/luaj-shadow.gradle'

// Keep source artwork and development utilities out of player distributions.
def playerResourceExcludes = [
        '**/.git/**', '**/__pycache__/**', '**/node_modules/**',
        '**/*.py', '**/*.pyc', '**/*.ps1', '**/*.bat', '**/*.cmd',
        '**/*.blend', '**/*.blend1', '**/*.bbmodel', '**/*.fbx',
        '**/*.psd', '**/*.xcf', '**/*.aseprite', '**/*.jfr',
        '**/*.log', '**/*.tmp', '**/*.bak'
]
tasks.named('processResources').configure { exclude playerResourceExcludes }
tasks.withType(Jar).configureEach { exclude playerResourceExcludes }

// Registry references used by client setup must exist even before a map pack is loaded.
def verifyBuiltinWeapons = tasks.register('verifyBuiltinWeaponResources') {
    inputs.file('java/me/cryo/zombierool/core/system/WeaponSystem.java')
    inputs.dir('resources/data/zombierool/gameplay/weapons')
    doLast {
        def source = file('java/me/cryo/zombierool/core/system/WeaponSystem.java').getText('UTF-8')
        def declaration = (source =~ /(?s)BUILTIN_WEAPONS\s*=\s*\{(.*?)\};/)
        if (!declaration.find()) throw new GradleException('Cannot locate built-in weapon declarations')
        def missing = []
        (declaration.group(1) =~ /"([a-z0-9_]+)"/).each { match ->
            def resource = file("resources/data/zombierool/gameplay/weapons/${match[1]}.json")
            if (!resource.isFile()) missing.add(match[1])
            else {
                def definition = new groovy.json.JsonSlurper().parse(resource, 'UTF-8')
                if (definition.id && definition.id != match[1] && definition.id != "zombierool:${match[1]}") {
                    throw new GradleException("Wrong weapon identity in ${resource.name}")
                }
            }
        }
        if (!missing.isEmpty()) throw new GradleException("Missing built-in weapon resources: ${missing.join(', ')}")
    }
}
tasks.named('check').configure { dependsOn verifyBuiltinWeapons }
tasks.named('processResources').configure { dependsOn verifyBuiltinWeapons }
